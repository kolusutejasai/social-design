<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset password | Social Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F5F8F3; --surface:#FFFFFF; --ink:#16251F; --muted:#586861; --line:#D6E0D9;
  --brand:#1E7A5A; --sun:#F6C85F; --err:#B3261E; --on-brand:#FFFFFF; --tint:#E6F3EC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1A15;--surface:#16261F;--ink:#EAF3EE;--muted:#9FB3A9;--line:#27403A;--brand:#5FD1A0;--on-brand:#0E1A15;--err:#FF8A80;--tint:#1B3A2E}
}
:root[data-theme="dark"]{--bg:#0E1A15;--surface:#16261F;--ink:#EAF3EE;--muted:#9FB3A9;--line:#27403A;--brand:#5FD1A0;--on-brand:#0E1A15;--err:#FF8A80;--tint:#1B3A2E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "DM Sans",system-ui,sans-serif}
a{color:var(--brand);font-weight:500}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
nav{background:var(--surface);border-bottom:1.5px solid var(--line)}
nav .bar{max-width:1080px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:800 20px "Bricolage Grotesque",sans-serif;color:var(--ink);text-decoration:none}
.links{display:flex;gap:20px}
.links a{color:var(--muted);text-decoration:none}
main{padding:40px 0 56px}
h1{font-size:clamp(32px,5vw,44px);line-height:1.05;font-weight:800;margin-bottom:10px}
h2{font-size:22px;font-weight:800;margin:30px 0 6px}
p,li{color:var(--ink)}
.draft{background:var(--tint);border:1.5px solid var(--brand);border-radius:12px;padding:12px 16px;font-size:15px;margin:16px 0 8px}
.updated{color:var(--muted);font-size:14px}
footer{border-top:1.5px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:15px}
footer .wrap{display:flex;gap:20px;flex-wrap:wrap}
label{display:block;font-weight:500;margin:20px 0 6px}
input[type=email]{width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;font:inherit;padding:13px 14px}
.btn{display:block;width:100%;border:0;border-radius:10px;background:var(--brand);color:var(--on-brand);font:700 16px "DM Sans",sans-serif;padding:14px;min-height:48px;cursor:pointer;margin-top:18px;text-align:center;text-decoration:none}
.err{color:var(--err);font-size:14px;margin-top:6px;min-height:20px}
.ok{display:none;background:var(--tint);border:1.5px solid var(--brand);border-radius:12px;padding:14px 16px;margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav><div class="bar"><a class="logo" href="product.html">Social Design</a><div class="links"><a href="login.html">Log in</a><a href="index.html">Sign up</a></div></div></nav>
<main><div class="wrap">
<h1>Reset your password</h1>
<p style="color:var(--muted)">Enter the email you signed up with and we’ll send you a link to choose a new password.</p>
<form id="f" novalidate>
  <label for="email">Email</label>
  <input type="email" id="email" autocomplete="email">
  <div class="err" id="err" role="alert"></div>
  <button class="btn" type="submit">Send reset link</button>
</form>
<div class="ok" id="ok" role="status"><strong>Check your email.</strong> If an account exists for that address, a reset link is on its way. This is a preview, so no email was sent.</div>
<p style="margin-top:22px"><a href="login.html">Back to log in</a></p>
<script>
const $ = id => document.getElementById(id);
$('f').addEventListener('submit', e => {
  e.preventDefault();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('email').value.trim())){ $('err').textContent = 'Enter a valid email, like name@example.com.'; $('email').focus(); return; }
  $('err').textContent = ''; $('f').style.display = 'none'; $('ok').style.display = 'block';
});
$('email').addEventListener('input', () => { if ($('err').textContent) $('err').textContent = ''; });
</script>
</div></main>
<footer><div class="wrap"><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a><a href="product.html">Home</a></div></footer>
</body>
</html>
