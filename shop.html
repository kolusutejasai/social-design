<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop | Social Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F1F3F9; --surface:#FFFFFF; --ink:#141B34; --muted:#5A6283; --line:#D3D8E8;
  --cobalt:#2E48F5; --pink:#FF7EB6; --sun:#FFC933; --mint:#33C9A0; --err:#C9254A;
  --on-cobalt:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0D1226;--surface:#171E3A;--ink:#EEF1FC;--muted:#A3ABCB;--line:#2C3560;--cobalt:#6F83FF;--err:#FF7B97;--on-cobalt:#0D1226}
}
:root[data-theme="dark"]{--bg:#0D1226;--surface:#171E3A;--ink:#EEF1FC;--muted:#A3ABCB;--line:#2C3560;--cobalt:#6F83FF;--err:#FF7B97;--on-cobalt:#0D1226}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
a{color:var(--cobalt);font-weight:500}
a:focus-visible,button:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* Nav */
nav{background:var(--surface);border-bottom:1.5px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:800 20px "Bricolage Grotesque",sans-serif;color:var(--ink);text-decoration:none}
.links{display:flex;gap:20px;align-items:center}
.links a.l{color:var(--muted);text-decoration:none}
.links a[aria-current]{color:var(--ink);font-weight:700}
.cartbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--cobalt);background:transparent;color:var(--cobalt);border-radius:10px;font:700 15px "DM Sans",sans-serif;padding:8px 14px;min-height:44px;cursor:pointer}
.cartbtn b{background:var(--cobalt);color:var(--on-cobalt);border-radius:99px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:13px;padding:0 6px}

/* Header + filters */
.top{padding:40px 0 20px}
.top h1{font-size:clamp(34px,5vw,52px);line-height:1.05;font-weight:800}
.top p{color:var(--muted);margin:10px 0 0;max-width:50ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 28px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;font:500 15px "DM Sans",sans-serif;padding:8px 18px;cursor:pointer;min-height:44px}
.chip[aria-pressed=true]{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-cobalt);font-weight:700}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-bottom:64px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:150px;position:relative;overflow:hidden}
.thumb i{position:absolute;display:block}
.v0 .p{width:80px;height:80px;border-radius:50%;right:18px;top:18px}
.v0 .q{width:60px;height:90px;left:20px;bottom:0;border-radius:60px 60px 0 0}
.v1 .p{width:110px;height:110px;border-radius:110px 0 0 0;right:0;bottom:0}
.v1 .q{width:50px;height:50px;border-radius:50%;left:24px;top:24px}
.v2 .p{width:70px;height:70px;border-radius:50%;border:12px solid;left:22px;top:22px}
.v2 .q{width:90px;height:60px;right:0;bottom:0;border-radius:60px 0 0 0}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:2px;flex:1}
.cat{color:var(--muted);font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.info h3{font-size:18px;font-weight:800;line-height:1.2}
.buy{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px}
.price{font:800 20px "Bricolage Grotesque",sans-serif}
.add{border:0;border-radius:10px;background:var(--cobalt);color:var(--on-cobalt);font:700 14px "DM Sans",sans-serif;padding:10px 16px;min-height:44px;cursor:pointer}
.add.done{background:var(--mint);color:#0D1226}
.empty{display:none;color:var(--muted);padding:20px 0 64px}

/* Cart drawer */
.veil{position:fixed;inset:0;background:rgba(10,14,30,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.veil.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility 0s .25s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.drawer.open{transform:none;visibility:visible;transition:transform .25s}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1.5px solid var(--line)}
.dh h2{font-size:24px;font-weight:800}
.x{border:0;background:transparent;color:var(--ink);font-size:28px;line-height:1;cursor:pointer;min-width:44px;min-height:44px}
.items{flex:1;overflow:auto;padding:8px 20px}
.none{color:var(--muted);padding:32px 0;text-align:center}
.line{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1.5px solid var(--line)}
.mini{width:52px;height:52px;border-radius:10px}
.line h3{font:700 16px "DM Sans",sans-serif;letter-spacing:0}
.line small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px;margin-top:4px}
.qty button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;width:32px;height:32px;font-size:18px;cursor:pointer}
.qty .rm{border:0;background:transparent;color:var(--err);font:500 14px "DM Sans",sans-serif;cursor:pointer;padding:6px 8px;margin-left:8px;width:auto;height:auto;min-height:32px}
.lt{font-weight:700;text-align:right}
.df{padding:18px 20px;border-top:1.5px solid var(--line);background:var(--surface)}
.sum{display:flex;justify-content:space-between;font:800 22px "Bricolage Grotesque",sans-serif;margin-bottom:12px}
.co{width:100%;border:0;border-radius:10px;background:var(--cobalt);color:var(--on-cobalt);font:700 16px "DM Sans",sans-serif;padding:14px;cursor:pointer;min-height:48px}
.co:disabled{opacity:.45;cursor:not-allowed}
.note{color:var(--muted);font-size:14px;margin:10px 0 0;min-height:21px}

@media (max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}.links .l{display:none}.thumb{height:120px}}
@media (max-width:400px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a class="logo" href="product.html">Social Design</a>
    <div class="links">
      <a class="l" href="profile.html">Profile</a>
      <a class="l" href="shop.html" aria-current="page">Shop</a>
      <button class="cartbtn" id="open" aria-haspopup="dialog">Cart <b id="count">0</b></button>
    </div>
  </div>
</nav>

<main class="wrap">
  <header class="top">
    <h1>The design shop</h1>
    <p>Kits, templates, icons, fonts and courses made by designers, for designers.</p>
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
  </header>
  <section class="grid" id="grid" aria-label="Products"></section>
</main>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dt" aria-hidden="true">
  <div class="dh"><h2 id="dt">Your cart</h2><button class="x" id="close" aria-label="Close cart">×</button></div>
  <div class="items" id="items"></div>
  <div class="df">
    <div class="sum"><span>Total</span><span id="total">$0</span></div>
    <button class="co" id="checkout" disabled>Checkout</button>
    <p class="note" id="note" role="status"></p>
  </div>
</aside>

<script>
const CURRENCY = 'USD'; // change to 'INR', 'EUR', etc.
const money = n => new Intl.NumberFormat('en-US', {style:'currency', currency:CURRENCY, maximumFractionDigits:0}).format(n);

// Sample products: replace with your own
const products = [
  {id:1, name:'Nova UI Kit',            cat:'UI kits',   price:49, bg:'#2E48F5', a:'#FF7EB6', b:'#FFC933', v:0},
  {id:2, name:'Fintech App Screens',    cat:'UI kits',   price:39, bg:'#33C9A0', a:'#141B34', b:'#FFC933', v:1},
  {id:3, name:'Portfolio Template',     cat:'Templates', price:29, bg:'#FFC933', a:'#2E48F5', b:'#FF7EB6', v:2},
  {id:4, name:'Pitch Deck Pack',        cat:'Templates', price:35, bg:'#FF7EB6', a:'#FFFFFF', b:'#2E48F5', v:0},
  {id:5, name:'Line Icon Set',          cat:'Icons',     price:19, bg:'#141B34', a:'#33C9A0', b:'#FF7EB6', v:1},
  {id:6, name:'Duotone Icons',          cat:'Icons',     price:24, bg:'#6F83FF', a:'#FFC933', b:'#FFFFFF', v:2},
  {id:7, name:'Grotesk Display Font',   cat:'Fonts',     price:29, bg:'#FFFFFF', a:'#2E48F5', b:'#FF7EB6', v:0},
  {id:8, name:'Design Systems Course',  cat:'Courses',   price:59, bg:'#2E48F5', a:'#33C9A0', b:'#FFFFFF', v:1}
];
const cats = ['All', ...new Set(products.map(p => p.cat))];
const $ = id => document.getElementById(id);

// Cart state (saved in the browser, so it survives a refresh)
let cart = {};
try { cart = JSON.parse(localStorage.getItem('sd-cart') || '{}'); } catch(e) { cart = {}; }
const save = () => { try { localStorage.setItem('sd-cart', JSON.stringify(cart)); } catch(e) {} };
const find = id => products.find(p => p.id === +id);

function thumb(p, cls){
  const ring = p.v === 2 ? `border-color:${p.a};` : '';
  return `<div class="${cls} v${p.v}" style="background:${p.bg}" aria-hidden="true">
    <i class="p" style="background:${p.v === 2 ? 'transparent' : p.a};${ring}"></i><i class="q" style="background:${p.b}"></i></div>`;
}

// Filters + grid
let active = 'All';
function drawChips(){
  $('chips').innerHTML = cats.map(c => `<button class="chip" aria-pressed="${c === active}" data-c="${c}">${c}</button>`).join('');
}
function drawGrid(){
  const list = products.filter(p => active === 'All' || p.cat === active);
  $('grid').innerHTML = list.map(p => `
    <article class="card">
      ${thumb(p, 'thumb')}
      <div class="info">
        <span class="cat">${p.cat}</span>
        <h3>${p.name}</h3>
        <div class="buy"><span class="price">${money(p.price)}</span>
        <button class="add" data-id="${p.id}">Add to cart</button></div>
      </div>
    </article>`).join('');
}
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  active = b.dataset.c; drawChips(); drawGrid();
});
$('grid').addEventListener('click', e => {
  const b = e.target.closest('.add'); if (!b) return;
  cart[b.dataset.id] = (cart[b.dataset.id] || 0) + 1;
  save(); drawCart();
  b.textContent = 'Added ✓'; b.classList.add('done');
  setTimeout(() => { b.textContent = 'Add to cart'; b.classList.remove('done'); }, 1200);
});

// Cart drawer
function drawCart(){
  const ids = Object.keys(cart).filter(id => cart[id] > 0 && find(id));
  const n = ids.reduce((s, id) => s + cart[id], 0);
  const total = ids.reduce((s, id) => s + cart[id] * find(id).price, 0);
  $('count').textContent = n;
  $('total').textContent = money(total);
  $('checkout').disabled = n === 0;
  $('items').innerHTML = ids.length ? ids.map(id => {
    const p = find(id);
    return `<div class="line">
      ${thumb(p, 'mini')}
      <div><h3>${p.name}</h3><small>${money(p.price)} each</small>
        <div class="qty"><button data-a="dec" data-id="${id}" aria-label="Decrease quantity of ${p.name}">−</button>
        <span aria-live="polite">${cart[id]}</span>
        <button data-a="inc" data-id="${id}" aria-label="Increase quantity of ${p.name}">+</button>
        <button class="rm" data-a="rm" data-id="${id}">Remove</button></div></div>
      <div class="lt">${money(cart[id] * p.price)}</div></div>`;
  }).join('') : '<p class="none">Your cart is empty.</p>';
}
$('items').addEventListener('click', e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.a === 'inc') cart[id]++;
  if (b.dataset.a === 'dec') cart[id] = Math.max(0, cart[id] - 1);
  if (b.dataset.a === 'rm') cart[id] = 0;
  if (!cart[id]) delete cart[id];
  save(); drawCart();
});

let opener = null;
function setDrawer(open){
  $('drawer').classList.toggle('open', open);
  $('veil').classList.toggle('open', open);
  $('drawer').setAttribute('aria-hidden', !open);
  if (open){ opener = document.activeElement; $('close').focus(); }
  else { $('note').textContent = ''; if (opener) opener.focus(); }
}
$('open').onclick = () => setDrawer(true);
$('close').onclick = () => setDrawer(false);
$('veil').onclick = () => setDrawer(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape') setDrawer(false); });
$('checkout').onclick = () => {
  $('note').textContent = 'Checkout isn’t connected yet. Payments come next (for example with Stripe).';
};

drawChips(); drawGrid(); drawCart();
</script>
</body>
</html>
