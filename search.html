<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search | Social Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F5F8F3; --surface:#FFFFFF; --ink:#16251F; --muted:#586861; --line:#D6E0D9;
  --brand:#1E7A5A; --coral:#F28B6B; --sun:#F6C85F; --sage:#A8D8BC;
  --on-brand:#FFFFFF; --hl:#FFE98A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1A15;--surface:#16261F;--ink:#EAF3EE;--muted:#9FB3A9;--line:#27403A;--brand:#5FD1A0;--on-brand:#0E1A15;--hl:#6B5A10}
}
:root[data-theme="dark"]{--bg:#0E1A15;--surface:#16261F;--ink:#EAF3EE;--muted:#9FB3A9;--line:#27403A;--brand:#5FD1A0;--on-brand:#0E1A15;--hl:#6B5A10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1{font:800 clamp(34px,5vw,52px)/1.05 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}

nav{background:var(--surface);border-bottom:1.5px solid var(--line)}
nav .in{max-width:1080px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:800 20px "Bricolage Grotesque",sans-serif}
.links{display:flex;gap:20px}
.links a{color:var(--muted)}
.links a[aria-current]{color:var(--ink);font-weight:700}

.top{padding:44px 0 16px}
.top p{color:var(--muted);margin:10px 0 24px}
.box{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 6px 0 16px;transition:border-color .15s}
.box:focus-within{border-color:var(--brand);outline:3px solid color-mix(in srgb,var(--brand) 25%,transparent)}
.box svg{flex:none;color:var(--muted)}
.box input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 18px "DM Sans",sans-serif;padding:16px 12px;outline:none}
.clr{border:0;background:transparent;color:var(--muted);font-size:26px;line-height:1;cursor:pointer;min-width:44px;min-height:44px;visibility:hidden}
.clr.show{visibility:visible}

.tabs[hidden]{display:none}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
.tab{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;font:500 15px "DM Sans",sans-serif;padding:8px 16px;cursor:pointer;min-height:44px}
.tab[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:700}
.tab small{opacity:.8;margin-left:4px}

.status{color:var(--muted);margin:14px 0 10px;min-height:24px}
.list{display:flex;flex-direction:column;gap:10px;padding-bottom:64px}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .15s,transform .1s}
.row:hover{border-color:var(--brand)}
.vis{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 16px "Bricolage Grotesque",sans-serif;color:#16251F}
.vis.sq{border-radius:12px}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:17px;line-height:1.3}
.txt span{color:var(--muted);font-size:14px}
.tag{flex:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);border:1.5px solid var(--brand);border-radius:99px;padding:2px 10px}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}

.trend{padding:8px 0 28px}
.trend h2{font:800 24px "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 4px}
.trend .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.trend .pills{margin-bottom:14px}
.tl{display:flex;flex-direction:column;gap:10px}
.rank{flex:none;width:26px;text-align:center;font:800 22px "Bricolage Grotesque",system-ui,sans-serif;color:var(--brand)}
.rc{display:block;margin-top:2px;font-size:13px;font-weight:700;color:var(--ink)}
.more{display:inline-block;margin-top:12px}
.pill[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:700}
.suggest{padding:8px 0 64px}
.suggest h2{font:700 15px "DM Sans",sans-serif;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;font:500 15px "DM Sans",sans-serif;padding:8px 16px;cursor:pointer;min-height:44px}
.pill:hover{border-color:var(--brand)}
@media (max-width:540px){.tag{display:none}.links{gap:14px}}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Shared menu: bottom tab bar on phones */
.tabbar{display:none}
@media (max-width:700px){
  nav .links{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1.5px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;color:var(--muted);text-decoration:none;font:500 11px "DM Sans",system-ui,sans-serif}
  .tabbar a[aria-current]{color:var(--brand);font-weight:700}
  .tabbar svg{width:24px;height:24px}
  .tabbar .plus{display:grid;place-items:center;width:44px;height:32px;border-radius:12px;background:var(--brand);color:var(--on-brand)}
  .tabbar .plus svg{width:22px;height:22px}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px)) !important}
}
</style>
</head>
<body>
<nav>
  <div class="in">
    <a class="logo" href="feed.html">Social Design</a>
    <div class="links">
      <a href="feed.html">Feed</a>
      <a href="search.html" aria-current="page">Search</a>
      <a href="shop.html">Shop</a>
      <a href="create-post.html">Create</a>
      <a href="profile.html">Profile</a>
    </div>
  </div>
</nav>

<main class="wrap">
  <header class="top">
    <h1>Search</h1>
    <p>Find coaches, posts and products.</p>
    <form class="box" role="search" id="form" autocomplete="off">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Try “sleep” or “yoga”" aria-label="Search Social Design" enterkeyhint="search">
      <button class="clr" id="clr" type="button" aria-label="Clear search">×</button>
    </form>
    <div class="tabs" id="tabs" role="group" aria-label="Filter results" hidden></div>
  </header>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="list" id="list"></div>

  <section class="trend" id="trend" aria-labelledby="th">
    <h2 id="th">Trending health posts</h2>
    <p class="sub">Ranked by Like, Vibe and Practice reactions.</p>
    <div class="pills" id="tpills" role="group" aria-label="Filter trending posts by topic"></div>
    <div class="tl" id="tlist"></div>
    <a class="more" href="feed.html">See all posts in the feed</a>
  </section>

  <section class="suggest" id="suggest">
    <h2>Popular searches</h2>
    <div class="pills" id="pills"></div>
  </section>
</main>

<div class="tabbar" role="navigation" aria-label="Main">
  <a href="feed.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Feed</span></a>
  <a href="search.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span></a>
  <a href="create-post.html"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span>Create</span></a>
  <a href="shop.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Shop</span></a>
  <a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span></a>
</div>
<script>
const $ = id => document.getElementById(id);
const C = {pink:'#F28B6B', sun:'#F6C85F', mint:'#A8D8BC', blue:'#5FD1A0', ink:'#16251F'};

// Sample data: replace with your real coaches, posts and products
const data = [
  {type:'Coaches', title:'Maya Rao',     sub:'Nutrition and lifestyle coach', tags:'nutrition food meal habits sleep',        href:'profile.html?coach=1', color:C.sun},
  {type:'Coaches', title:'Arjun Mehta',  sub:'Strength and conditioning coach',tags:'fitness strength training gym',          href:'profile.html?coach=1', color:C.pink},
  {type:'Coaches', title:'Lena Park',    sub:'Yoga and mindfulness teacher',  tags:'yoga mindfulness meditation stress',      href:'profile.html?coach=1', color:C.mint},
  {type:'Coaches', title:'Omar Haddad',  sub:'Running coach',                 tags:'running cardio endurance 5k',             href:'profile.html?coach=1', color:C.blue},
  {type:'Coaches', title:'Sofia Reyes',  sub:'Sleep and stress coach',        tags:'sleep stress relaxation',                 href:'profile.html?coach=1', color:C.pink},
  {type:'Coaches', title:'Kenji Sato',   sub:'Mental wellness coach',         tags:'mental wellness anxiety mindfulness habits', href:'profile.html?coach=1', color:C.sun},
  {type:'Posts',   title:'Sunday meal prep in 45 minutes', sub:'Nutrition post by Maya Rao',      tags:'nutrition meal prep food',   href:'profile.html?coach=1', color:C.blue},
  {type:'Posts',   title:'Beginner strength: week one',    sub:'Fitness post by Arjun Mehta',     tags:'fitness strength beginner',  href:'profile.html?coach=1', color:C.mint},
  {type:'Posts',   title:'A 10-minute evening wind-down',  sub:'Sleep post by Sofia Reyes',       tags:'sleep relax evening routine',href:'profile.html?coach=1', color:C.sun},
  {type:'Posts',   title:'Morning yoga for stiff shoulders',sub:'Yoga post by Lena Park',         tags:'yoga stretch morning',       href:'profile.html?coach=1', color:C.pink},
  {type:'Posts',   title:'Your first 5K, step by step',    sub:'Running post by Omar Haddad',     tags:'running 5k beginner',        href:'profile.html?coach=1', color:C.mint},
  {type:'Posts',   title:'Mindful breathing for busy days',sub:'Mental wellness post by Kenji Sato',tags:'mindfulness breathing stress',href:'profile.html?coach=1', color:C.blue},
  {type:'Products',title:'4-Week Strength Starter',      sub:'Program · $39',   tags:'program strength fitness beginner', href:'shop.html', color:C.blue},
  {type:'Products',title:'30-Day Mindful Mornings',      sub:'Program · $29',   tags:'program mindfulness morning',       href:'shop.html', color:C.mint},
  {type:'Products',title:'Balanced Vegetarian Meal Plan',sub:'Meal plan · $24', tags:'meal plan vegetarian nutrition',    href:'shop.html', color:C.sun},
  {type:'Products',title:'High-Protein Meal Plan',       sub:'Meal plan · $24', tags:'meal plan protein nutrition',       href:'shop.html', color:C.pink},
  {type:'Products',title:'Better Sleep Guide',           sub:'Guide · $15',     tags:'guide sleep',                       href:'shop.html', color:C.ink},
  {type:'Products',title:'Stress Relief Toolkit',        sub:'Guide · $19',     tags:'guide stress relief',               href:'shop.html', color:C.blue},
  {type:'Products',title:'Habit Coaching Course',        sub:'Course · $59',    tags:'course habits coaching',            href:'shop.html', color:C.sun},
  {type:'Products',title:'Beginner Yoga Flow',           sub:'Course · $35',    tags:'course yoga beginner',              href:'shop.html', color:C.mint}
];
const suggestions = ['Nutrition', 'Sleep', 'Yoga', 'Strength', 'Meal plans', 'Stress relief'];
const kinds = ['All', 'Coaches', 'Posts', 'Products'];
const one = {Coaches:'Coach', Posts:'Post', Products:'Product'};
let kind = 'All';

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function mark(text, words){
  let out = esc(text);
  words.forEach(w => { out = out.replace(new RegExp('(' + reEsc(esc(w)) + ')(?![^<]*>)', 'gi'), '<mark>$1</mark>'); });
  return out;
}
function initials(n){ return n.split(' ').map(w => w[0]).join('').slice(0, 2); }

function match(q){
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return {words, hits:[]};
  const hits = data.map(d => {
    const name = d.title.toLowerCase(), rest = (d.sub + ' ' + d.tags).toLowerCase();
    let score = 0;
    for (const w of words){
      if (name.includes(w)) score += name.startsWith(w) ? 3 : 2;
      else if (rest.includes(w)) score += 1;
      else return null; // every word must match
    }
    return {d, score};
  }).filter(Boolean).sort((a, b) => b.score - a.score).map(x => x.d);
  return {words, hits};
}

function render(){
  const q = $('q').value.trim();
  $('clr').classList.toggle('show', !!$('q').value);
  const {words, hits} = match(q);
  $('tabs').hidden = !q;
  $('suggest').style.display = $('trend').style.display = q ? 'none' : '';
  if (!q){ $('list').innerHTML = ''; $('status').textContent = ''; return; }

  $('tabs').innerHTML = kinds.map(k => {
    const n = k === 'All' ? hits.length : hits.filter(h => h.type === k).length;
    return `<button class="tab" type="button" aria-pressed="${k === kind}" data-k="${k}">${k}<small>${n}</small></button>`;
  }).join('');

  const shown = hits.filter(h => kind === 'All' || h.type === kind);
  $('status').textContent = shown.length
    ? `${shown.length} result${shown.length === 1 ? '' : 's'} for “${q}”`
    : `No results for “${q}”. Try a shorter word or a different category.`;
  $('list').innerHTML = shown.map(h => {
    const person = h.type === 'Coaches';
    return `<a class="row" href="${h.href}">
      <span class="vis ${person ? '' : 'sq'}" style="background:${h.color};${h.color === C.ink ? 'color:#fff' : ''}" aria-hidden="true">${person ? initials(h.title) : ''}</span>
      <span class="txt"><b>${mark(h.title, words)}</b><span>${mark(h.sub, words)}</span></span>
      <span class="tag">${one[h.type]}</span></a>`;
  }).join('');
}

$('q').addEventListener('input', () => { kind = 'All'; render(); });
$('form').addEventListener('submit', e => { e.preventDefault(); $('q').blur(); });
$('clr').onclick = () => { $('q').value = ''; kind = 'All'; render(); $('q').focus(); };
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  kind = b.dataset.k; render();
});
$('pills').innerHTML = suggestions.map(s => `<button class="pill" type="button">${s}</button>`).join('');
$('pills').addEventListener('click', e => {
  const b = e.target.closest('.pill'); if (!b) return;
  $('q').value = b.textContent; kind = 'All'; render(); $('q').focus();
});

// On your own site, links like search.html?q=icons will pre-fill the search
try { const p = new URLSearchParams(location.search).get('q'); if (p) $('q').value = p; } catch(e) {}

// ---------- Trending posts (sample numbers; real ones will come from your database)
const trending = [
  {t:'Sunday meal prep in 45 minutes',        who:'Maya Rao',    cat:'Nutrition',            kind:'Photo', time:'2h', l:128, v:34, p:21, color:C.sun},
  {t:'A gentle 10-minute morning flow',       who:'Lena Park',   cat:'Yoga and mindfulness', kind:'Video', time:'4h', l:96,  v:41, p:18, color:C.mint},
  {t:'A 3-minute wind-down for tonight',      who:'Sofia Reyes', cat:'Sleep',                kind:'Voice note', time:'6h', l:74, v:52, p:27, color:C.pink},
  {t:'Beginner strength: week one',           who:'Arjun Mehta', cat:'Fitness',              kind:'Photo', time:'9h', l:152, v:22, p:45, color:C.blue},
  {t:'The 5-4-3-2-1 grounding exercise',      who:'Kenji Sato',  cat:'Mental wellness',      kind:'Post',  time:'1d', l:211, v:67, p:30, color:C.sun},
  {t:'Your first 5K, step by step',           who:'Omar Haddad', cat:'Fitness',              kind:'Photo', time:'1d', l:88,  v:15, p:33, color:C.mint},
  {t:'Attach a new habit to one you have',    who:'Maya Rao',    cat:'Habits',               kind:'Post',  time:'2d', l:176, v:48, p:61, color:C.blue},
  {t:'Mindful breathing for busy days',       who:'Lena Park',   cat:'Yoga and mindfulness', kind:'Voice note', time:'3d', l:64, v:26, p:14, color:C.pink}
];
const glyph = {Photo:'▣', Video:'▶', 'Voice note':'♪', Post:'✎'};
const tcats = ['All', 'Nutrition', 'Fitness', 'Sleep', 'Mental wellness', 'Yoga and mindfulness', 'Habits'];
let tcat = 'All';
function drawTrend(){
  $('tpills').innerHTML = tcats.map(c => `<button class="pill" type="button" data-c="${c}" aria-pressed="${c === tcat}">${c}</button>`).join('');
  const list = trending.filter(x => tcat === 'All' || x.cat === tcat)
    .sort((a, b) => (b.l + b.v + b.p) - (a.l + a.v + a.p)).slice(0, 5);
  $('tlist').innerHTML = list.map((x, i) => `<a class="row" href="feed.html">
    <span class="rank" aria-label="Number ${i + 1}">${i + 1}</span>
    <span class="vis sq" style="background:${x.color};${x.color === C.ink ? 'color:#fff' : ''}" aria-hidden="true">${glyph[x.kind]}</span>
    <span class="txt"><b>${esc(x.t)}</b><span>${esc(x.who)} · ${x.cat} · ${x.kind} · ${x.time}</span>
    <span class="rc">♡ ${x.l} &nbsp;✦ ${x.v} &nbsp;✓ ${x.p}</span></span></a>`).join('') || '<p class="sub">No trending posts in this topic yet.</p>';
}
$('tpills').addEventListener('click', e => { const b = e.target.closest('.pill'); if (!b) return; tcat = b.dataset.c; drawTrend(); });
drawTrend();
render();
</script>
</body>
</html>
