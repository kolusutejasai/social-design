<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose your profile | Social Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F5F8F3; --surface:#FFFFFF; --ink:#16251F; --muted:#586861; --line:#D6E0D9;
  --brand:#1E7A5A; --coral:#F28B6B; --sun:#F6C85F; --sage:#A8D8BC;
  --on-brand:#FFFFFF; --tint:#E6F3EC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1A15;--surface:#16261F;--ink:#EAF3EE;--muted:#9FB3A9;--line:#27403A;--brand:#5FD1A0;--on-brand:#0E1A15;--tint:#1B3A2E}
}
:root[data-theme="dark"]{--bg:#0E1A15;--surface:#16261F;--ink:#EAF3EE;--muted:#9FB3A9;--line:#27403A;--brand:#5FD1A0;--on-brand:#0E1A15;--tint:#1B3A2E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;min-height:100vh}
.page{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}

.board{position:relative;padding:48px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:var(--brand);color:var(--on-brand)}
.logo{font:800 22px "Bricolage Grotesque",sans-serif;letter-spacing:-.01em;position:relative;z-index:2;color:inherit;text-decoration:none}
.board h2{font:800 clamp(34px,4.4vw,58px)/1.04 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin:0;max-width:11ch;position:relative;z-index:2}
.board p{margin:16px 0 0;max-width:34ch;position:relative;z-index:2;opacity:.94}
.shapes{position:absolute;inset:0;z-index:1}
.shapes i{position:absolute;display:block}
.s1{width:230px;height:230px;border-radius:50%;background:var(--coral);right:-60px;top:-50px}
.s2{width:160px;height:160px;background:var(--sun);right:110px;top:190px;border-radius:0 160px 0 0}
.s3{width:110px;height:220px;background:var(--sage);right:-10px;top:280px;border-radius:110px 110px 0 0}
.s4{width:80px;height:80px;border:14px solid var(--on-brand);border-radius:50%;right:250px;top:60px;opacity:.85}

.panel{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.card{width:100%;max-width:460px}
.card h1{font:800 32px/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin:0 0 8px;outline:none}
.sub{color:var(--muted);margin:0 0 24px}
fieldset{border:0;padding:0;margin:0}
legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick{position:relative;display:block;margin:0 0 14px}
.pick input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.box{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px;transition:border-color .15s,background .15s}
.pick:hover .box{border-color:var(--brand)}
.pick input:checked + .box{border-color:var(--brand);background:var(--tint)}
.pick input:focus-visible + .box{outline:3px solid var(--brand);outline-offset:2px}
.ico{flex:none;width:52px;height:52px}
.box .t{display:block;font:800 20px/1.2 "Bricolage Grotesque",sans-serif;margin:0 0 4px}
.box .d{display:block;color:var(--muted);font-size:15px}
.tick{margin-left:auto;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:15px;font-weight:700}
.pick input:checked + .box .tick{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.later{color:var(--muted);font-size:14px;margin:4px 0 0}
.btn{width:100%;display:block;text-align:center;text-decoration:none;border:0;border-radius:10px;background:var(--brand);color:var(--on-brand);font:700 16px "DM Sans",sans-serif;padding:14px;cursor:pointer;min-height:48px;margin-top:20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
a{color:var(--brand);font-weight:500}
.done{display:none}
.done.show{display:block}
.badge{width:56px;height:56px;border-radius:50%;background:var(--sage);margin-bottom:20px;display:grid;place-items:center;color:#0E1A15;font-size:28px;font-weight:700}

@media (max-width:820px){
  .page{grid-template-columns:1fr}
  .board{padding:28px 24px;min-height:190px;gap:28px}
  .board h2{font-size:30px;max-width:78%}
  .board p{display:none}
  .s1{width:140px;height:140px;right:-40px;top:-40px}
  .shapes .s2{display:none}
  .s3{width:70px;height:120px;right:0;top:120px;border-radius:70px 70px 0 0}
  .shapes .s4{display:none}
  .panel{padding:28px 20px 48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <aside class="board">
    <div class="shapes" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i></div>
    <a class="logo" href="product.html">Social Design</a>
    <div>
      <h2>One community. Two ways to join.</h2>
      <p>Coaches share their knowledge. Members learn and grow. Pick the profile that fits you.</p>
    </div>
  </aside>

  <main class="panel">
    <div class="card">
      <form id="form">
        <h1 id="title" tabindex="-1">Choose your profile</h1>
        <p class="sub">How will you use Social Design?</p>
        <fieldset>
          <legend>Profile type</legend>

          <label class="pick">
            <input type="radio" name="type" value="Content creator">
            <span class="box">
              <svg class="ico" viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="14" fill="var(--sun)"/><circle cx="26" cy="20" r="8" fill="#16251F"/><path d="M12 42a14 14 0 0 1 28 0z" fill="#16251F"/></svg>
              <span>
                <strong class="t">Content creator</strong>
                <span class="d">For coaches and wellness professionals. Share posts, build an audience and offer your programs.</span>
              </span>
              <span class="tick" aria-hidden="true">✓</span>
            </span>
          </label>

          <label class="pick">
            <input type="radio" name="type" value="User">
            <span class="box">
              <svg class="ico" viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="14" fill="var(--sage)"/><path d="M26 40S12 31 12 21a7 7 0 0 1 14-2 7 7 0 0 1 14 2c0 10-14 19-14 19z" fill="#16251F"/></svg>
              <span>
                <strong class="t">User</strong>
                <span class="d">For anyone on a health journey. Follow coaches, learn, save content and join the community.</span>
              </span>
              <span class="tick" aria-hidden="true">✓</span>
            </span>
          </label>
        </fieldset>
        <p class="later">You can change this later.</p>
        <button class="btn" type="submit" id="go" disabled>Continue</button>
      </form>

      <section class="done" id="done" aria-live="polite">
        <div class="badge" aria-hidden="true">✓</div>
        <h1 id="msg">You’re all set</h1>
        <p class="sub" id="detail"></p>
        <a class="btn" href="profile.html">Go to my profile</a>
      </section>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const form = $('form');
form.addEventListener('change', () => { $('go').disabled = !form.querySelector('input:checked'); });
form.addEventListener('submit', e => {
  e.preventDefault();
  const t = form.querySelector('input:checked');
  if (!t) return;
  const creator = t.value === 'Content creator';
  $('msg').textContent = creator ? 'You’re a content creator' : 'You’re a member';
  $('detail').textContent = creator
    ? 'Next, you’ll set up your coach profile so people can find you. This is a preview, so nothing was saved yet.'
    : 'Next, we’ll show you coaches and content that match your interests. This is a preview, so nothing was saved yet.';
  form.style.display = 'none';
  $('done').classList.add('show');
  $('msg').focus && window.scrollTo(0, 0);
});
</script>
</body>
</html>
