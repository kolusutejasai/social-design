<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in to Social Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F5F8F3; --surface:#FFFFFF; --ink:#16251F; --muted:#586861; --line:#D6E0D9;
  --brand:#1E7A5A; --coral:#F28B6B; --sun:#F6C85F; --sage:#A8D8BC; --err:#B3261E;
  --on-brand:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1A15;--surface:#16261F;--ink:#EAF3EE;--muted:#9FB3A9;--line:#27403A;--err:#FF8A80;--brand:#5FD1A0;--on-brand:#0E1A15}
}
:root[data-theme="dark"]{--bg:#0E1A15;--surface:#16261F;--ink:#EAF3EE;--muted:#9FB3A9;--line:#27403A;--err:#FF8A80;--brand:#5FD1A0;--on-brand:#0E1A15}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;min-height:100vh}
.page{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}

/* Design board (shapes are arranged differently from the sign up page) */
.board{position:relative;padding:48px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:var(--brand);color:var(--on-brand)}
.logo{font:800 22px "Bricolage Grotesque",sans-serif;letter-spacing:-.01em;position:relative;z-index:2;color:inherit;text-decoration:none}
.board h2{font:800 clamp(34px,4.4vw,60px)/1.02 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin:0;max-width:10ch;position:relative;z-index:2}
.board p{margin:16px 0 0;max-width:34ch;position:relative;z-index:2;opacity:.92}
.shapes{position:absolute;inset:0;z-index:1}
.shapes i{position:absolute;display:block}
.s1{width:230px;height:230px;border-radius:50%;background:var(--sun);right:-60px;top:-50px}
.s2{width:160px;height:160px;background:var(--coral);right:110px;top:190px;border-radius:0 160px 0 0}
.s3{width:110px;height:220px;background:var(--sage);right:-10px;top:280px;border-radius:110px 110px 0 0}
.s4{width:80px;height:80px;border:14px solid var(--on-brand);border-radius:50%;right:250px;top:60px;opacity:.9}

/* Form */
.panel{display:flex;align-items:center;justify-content:center;padding:48px 24px}
.card{width:100%;max-width:420px}
.card h1{font:800 34px/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 28px}
.field{margin-bottom:18px}
label{display:block;font-weight:500;margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:baseline}
.input{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;transition:border-color .15s}
.input:focus-within{border-color:var(--brand);outline:3px solid color-mix(in srgb,var(--brand) 25%,transparent)}
.input.bad{border-color:var(--err)}
input[type=text],input[type=password]{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:13px 14px;outline:none}
.toggle{border:0;background:transparent;color:var(--muted);font:500 14px "DM Sans",sans-serif;padding:0 14px;cursor:pointer;min-height:44px}
.toggle:focus-visible,.btn:focus-visible,a:focus-visible,.check input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.err{color:var(--err);font-size:14px;margin-top:4px}
.check{display:flex;gap:10px;align-items:center;margin:6px 0 22px;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.btn{width:100%;border:0;border-radius:10px;background:var(--brand);color:var(--on-brand);font:700 16px "DM Sans",sans-serif;padding:14px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.98)}
a{color:var(--brand);font-weight:500}
.alt{text-align:center;color:var(--muted);margin-top:22px}
.done{display:none}
.done.show{display:block}
.done .badge{width:56px;height:56px;border-radius:50%;background:var(--sage);margin-bottom:20px;display:grid;place-items:center;color:#0E1A15;font-size:28px;font-weight:700}

@media (max-width:820px){
  .page{grid-template-columns:1fr}
  .board{padding:28px 24px;min-height:200px;gap:28px}
  .board h2{font-size:34px;max-width:78%}
  .board p{display:none}
  .s1{width:140px;height:140px;right:-40px;top:-40px}
  .shapes .s2{display:none}
  .s3{width:70px;height:120px;right:0;top:120px;border-radius:70px 70px 0 0}
  .shapes .s4{display:none}
  .panel{padding:32px 20px 48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <aside class="board">
    <div class="shapes" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i></div>
    <a class="logo" href="product.html">Social Design</a>
    <div>
      <h2>Welcome back.</h2>
      <p>Your coaches, community and goals are waiting for you.</p>
    </div>
  </aside>

  <main class="panel">
    <div class="card">
      <form id="form" novalidate>
        <h1>Log in</h1>
        <p class="sub">Enter your details to pick up where you left off.</p>

        <div class="field">
          <label for="id">Email or username</label>
          <div class="input" id="w-id"><input type="text" id="id" autocomplete="username" autocapitalize="none"></div>
          <div class="err" id="e-id" role="alert"></div>
        </div>

        <div class="field">
          <div class="row"><label for="pw">Password</label><a href="forgot-password.html">Forgot password?</a></div>
          <div class="input" id="w-pw">
            <input type="password" id="pw" autocomplete="current-password">
            <button type="button" class="toggle" id="tg" aria-label="Show password">Show</button>
          </div>
          <div class="err" id="e-pw" role="alert"></div>
        </div>

        <label class="check"><input type="checkbox" id="remember"> <span>Keep me logged in</span></label>

        <button class="btn" type="submit">Log in</button>
        <p class="alt">New to Social Design? <a href="index.html">Create an account</a></p>
      </form>

      <section class="done" id="done" aria-live="polite">
        <div class="badge" aria-hidden="true">✓</div>
        <h1>You’re in!</h1>
        <p class="sub">This is a preview, so no real login happened yet.</p>
        <a class="btn" href="feed.html" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px">Go to my feed</a>
        <button class="btn" type="button" id="again" style="background:transparent;color:var(--brand);border:1.5px solid var(--brand)">Back to log in</button>
      </section>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const form = $('form');
const rules = {
  id: v => v.trim() ? '' : 'Enter your email or username.',
  pw: v => v ? '' : 'Enter your password.'
};
function check(k){
  const msg = rules[k]($(k).value);
  $('e-' + k).textContent = msg;
  $('w-' + k).classList.toggle('bad', !!msg);
  return !msg;
}
Object.keys(rules).forEach(k => $(k).addEventListener('blur', () => check(k)));

$('tg').addEventListener('click', () => {
  const hidden = $('pw').type === 'password';
  $('pw').type = hidden ? 'text' : 'password';
  $('tg').textContent = hidden ? 'Hide' : 'Show';
  $('tg').setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
});

form.addEventListener('submit', e => {
  e.preventDefault();
  const ok = Object.keys(rules).map(check).every(Boolean);
  if (ok){
    form.style.display = 'none';
    $('done').classList.add('show');
  } else {
    const bad = form.querySelector('.input.bad input');
    if (bad) bad.focus();
  }
});
$('again').addEventListener('click', () => {
  form.reset(); form.style.display = '';
  $('done').classList.remove('show');
});
</script>
</body>
</html>
